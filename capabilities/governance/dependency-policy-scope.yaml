id: governance.dependency-policy.scope
category: governance
kind: atomic
version: "1.0"
status: stable
description: >
  Scope policy sub-gate (D-R11) for the Dependency Policy gate. Allows per-scope
  enforcement overrides: compile and runtime default to BLOCK; test, dev, provided,
  and build default to WARN_ONLY. Scope is extracted from the dependency manifest
  (Maven scope, npm devDependencies, Go test imports). Requires
  governance.dependency-policy to be active.
requires-capabilities: [governance.dependency-policy]
requires: []
excludes: []
universal: true
tags:
  - governance
  - dependency-policy
  - scope-policy
  - cross-stack
  - sca
