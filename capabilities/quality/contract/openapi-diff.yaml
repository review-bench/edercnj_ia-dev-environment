id: quality.contract.openapi-diff
category: quality
kind: atomic
version: "1.0"
status: stable
description: >
  OpenAPI breaking-change gate using openapi-diff — compares current OpenAPI spec
  against the baseline, fails on BREAKING classification. Invoked by /x-test-contract
  when interfaces[].spec contains an openapi path.
requires-capabilities: []
requires: []
excludes: []
universal: false
parameters:
  tool:
    type: string
    enum: [openapi-diff]
    default: openapi-diff
  fail_on_breaking:
    type: boolean
    default: true
  warn_on_non_breaking:
    type: boolean
    default: true
