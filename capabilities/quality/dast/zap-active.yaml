id: quality.dast.zap-active
category: quality
kind: atomic
version: "1.0"
status: stable
description: >
  OWASP ZAP active scan — sends injection payloads (SQLi, XSS, path traversal, CSRF, etc.)
  against the target application. Used in the full tier (tier-nightly) of /x-pentest-dynamic.
  Runtime: 10-15 minutes. Generates SARIF 2.1.0 + Markdown report. Findings above HIGH block
  nightly workflow (informative for nightly — not a PR gate). Production target forbidden.
requires-capabilities: []
requires: []
excludes: []
universal: false
parameters:
  target:
    type: string
    enum: [local-container, preview-env, staging]
    default: local-container
  timeout-minutes:
    type: integer
    default: 35
  active-scan-policy:
    type: string
    enum: [default, custom-pci, custom-lgpd]
    default: default
  compliance:
    type: array
    items:
      type: string
      enum: [pci, lgpd, hipaa]
    default: []
