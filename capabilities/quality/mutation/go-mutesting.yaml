id: quality.mutation.go-mutesting
category: quality
kind: atomic
version: "1.0"
status: stable
description: >
  Go mutation gate using go-mutesting — runs go-mutesting ./..., fails when mutation
  score < QualityConfig.mutation.threshold. Runtime capped by runtimeCapMin. Invoked
  by /x-test-mutation when language = go.
requires-capabilities: []
requires: []
excludes: []
universal: false
parameters:
  tool:
    type: string
    enum: [go-mutesting]
    default: go-mutesting
  threshold:
    type: integer
    default: 80
  runtime_cap_min:
    type: integer
    default: 10
