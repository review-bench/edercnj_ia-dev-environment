id: quality.mutation.mutmut
category: quality
kind: atomic
version: "1.0"
status: stable
description: >
  Python mutation gate using mutmut — runs mutmut run, fails when surviving mutants
  exceed the threshold. Runtime capped by runtimeCapMin. Invoked by /x-test-mutation
  when language = python.
requires-capabilities: []
requires: []
excludes: []
universal: false
parameters:
  tool:
    type: string
    enum: [mutmut]
    default: mutmut
  threshold:
    type: integer
    default: 80
  runtime_cap_min:
    type: integer
    default: 10
