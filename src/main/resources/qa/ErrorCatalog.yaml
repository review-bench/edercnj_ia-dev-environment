---
# Error Catalog — canonical list of expected error paths
# QA must verify test coverage for every entry in this catalog.
version: "1.0"
entries:
  - errorCode: InvalidToken
    httpStatus: 401
    condition: "JWT signature invalid or token expired"
    recovery: "Refresh token, retry once"
    testRequired: true

  - errorCode: RateLimitExceeded
    httpStatus: 429
    condition: "Request rate exceeds 1000 req/min per client"
    recovery: "Backoff 60s, retry with exponential backoff"
    testRequired: true

  - errorCode: DatabaseDown
    httpStatus: 503
    condition: "Database connection refused or timeout exceeded"
    recovery: "Circuit breaker active, return cached fallback or 503"
    testRequired: true

  - errorCode: ResourceNotFound
    httpStatus: 404
    condition: "Requested entity does not exist in the data store"
    recovery: "No retry; surface 404 to caller"
    testRequired: true

  - errorCode: ValidationFailed
    httpStatus: 422
    condition: "Request body fails schema validation"
    recovery: "Fix request payload; no retry"
    testRequired: true
