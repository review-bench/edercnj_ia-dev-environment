## Dependencies

- **Runtime:** None
- **Build:** Maven, Java 21
- **Governance:** Requires `governance` capability for status management
- **Observability:** Telemetry events require observability infrastructure (optional)

## Constraints

1. **Bug Description:** 8 ≤ length ≤ 200 characters
2. **Slug:** lowercase alphanumeric + hyphens, max 40 characters
3. **Status Transitions:** Linear progression with optional lateral moves to Bloqueada / Descartada
4. **Reproduction Steps:** Minimum 1, maximum 10 distinct steps
5. **Test Coverage:** Regression test must pass before marking bug as Concluída

## Usage

### Creating a Bug Report

```bash
# Manual template instantiation
cp src/main/resources/targets/claude/templates/_TEMPLATE-BUG.md \
   docs/bugs/bug-{{BUG_ID}}-{{SLUG}}.md

# Fill in all 9 sections and run refinement
/x-refine-bug docs/bugs/bug-{{BUG_ID}}-{{SLUG}}.md
```

### Workflow

```
Pendente (draft)
  ↓ [refinement approved]
Refinada (ready for investigation)
  ↓ [investigation starts]
Em Investigação (root-cause analysis in progress)
  ↓ [fix assigned]
Em Correção (fix implementation in progress)
  ↓ [tests pass]
Concluída (resolved and deployed)
```

Optional transitions:
- `→ Bloqueada` (blocked by external dependency or prerequisite)
- `→ Descartada` (duplicate, wontfix, or superseded)
- `→ Falha` (fix validation failed, reverting to Em Correção)

## Telemetry

When enabled, the capability emits the following events:

| Event Type | Trigger | Fields |
| :--- | :--- | :--- |
| `phase.start` | Bug refinement begins | phase, story_id, timestamp |
| `phase.end` | Bug refinement completes | phase, story_id, status, timestamp |
| `tool.call` | Skill invocation (x-create-bug) | tool, args, result, duration_ms |
| `session.start` | Bug lifecycle session opens | session_id, user, timestamp |
| `session.end` | Bug lifecycle session closes | session_id, status, duration_ms |

KPI: P75 resolution time must not exceed 8 minutes (from Pendente to Concluída).

## Configuration

No runtime configuration required. All behavior is determined by the template structure and the governing capability declarations in `requires-capabilities` frontmatter.

