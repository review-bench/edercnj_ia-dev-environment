# Bug Lifecycle Management Capability

## Overview

Defines the Bug Lifecycle Management capability that enables structured bug tracking, classification, reproduction, investigation, and resolution within the IA Dev Environment.

## Capability Metadata

| Field | Value |
| :--- | :--- |
| Capability ID | `governance.bug-lifecycle` |
| Version | `1.0` |
| Type | Governance |
| Status | Active |
| Introduced | EPIC-0080 |

## Scope

This capability provides:

1. **Bug Lifecycle Template** (`_TEMPLATE-BUG.md`):
   - Structured markdown template with 9 RA9 sections
   - Bug-specific subsections for reproduction, root-cause analysis, and regression testing
   - YAML frontmatter with capability declaration

2. **Skill Integration** (`x-create-bug`):
   - CLI command to instantiate new bug reports from template
   - Automated slug generation from bug description
   - Status lifecycle management (Pendente → Refinada → Em Investigação → Em Correção → Concluída)

3. **Classification & Telemetry**:
   - Fault type classification (Logic, Data, Integration, Concurrency, Performance, Security)
   - KPI tracking for P75 resolution time ≤ 8 minutes
   - Structured telemetry events (phase.start/end, tool.call, session.start/end)

