# CI + Release pipeline.
#
#   on PR to develop/main/release/**   -> test + dependency-review
#   on push to develop/main/release/** -> test
#   on tag v*                          -> test + publish + release-assets
#
# Required repo secrets / settings:
#   - CODECOV_TOKEN  (free for public repos; https://app.codecov.io)
#   - GitHub Packages must be enabled for the repo (default: yes)
#   - All other tokens (GITHUB_TOKEN, id-token, attestations) are built-in.

name: CI / Release

on:
  push:
    branches: [develop, main, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [develop, main, "release/**"]

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Build + verify (mvn -B verify)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # fetch-depth: 0 is required so that Java auditors can resolve git
          # history (e.g., merged story branches in ExecutionIntegrityAuditor).
          # A shallow clone (default fetch-depth: 1) makes commits unreachable
          # and produces false-positive violations.
          fetch-depth: 0

      - name: Setup JDK 21 (Temurin) + Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: mvn -B verify
        run: mvn -B verify

      - name: Upload JaCoCo report (artifact, retention 7d)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report-${{ github.run_id }}
          path: target/site/jacoco/
          retention-days: 7

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco/jacoco.xml
          flags: unit
          fail_ci_if_error: false

  # EPIC-0059 story-0059-0006: Re-runs the pre-commit chain (format → lint → compile)
  # on PRs that touch Java source or pom.xml. Closes bypass surface E
  # (git commit --no-verify) by invalidating local hook bypasses at the CI gate.
  #
  # Path filter (on.pull_request.paths at the workflow level is the primary gate;
  # the javadiff step below is a secondary defensive check for re-triggered runs).
  pre-commit-chain:
    name: Pre-commit Chain (format/lint/compile)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (full depth for diff)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup JDK 21 (Temurin) + Maven cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Defensive diff detection: checks whether the PR actually touches
      # src/main/java/ or pom.xml (guards against re-triggered runs that
      # bypass the path filter via workflow_dispatch or re-run buttons).
      - name: Detect Java diff
        id: javadiff
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          HEAD_SHA="${{ github.sha }}"
          # Fetch base branch so git diff has both sides
          git fetch origin "${BASE_REF}" --depth=1 2>/dev/null || true
          if git diff --name-only "origin/${BASE_REF}...${HEAD_SHA}" \
              | grep -qE '^(src/main/java/|pom\.xml$|checkstyle-suppressions\.xml$)'; then
            echo "java_changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "java_changed=false" >> "${GITHUB_OUTPUT}"
          fi

      # Step 1 — Format check (Spotless / Google Java Format).
      # Fails if any Java file in the PR is not formatted according to AOSP style.
      # Developer fix: run `mvn spotless:apply` locally and re-commit.
      - name: Format check (Spotless)
        if: steps.javadiff.outputs.java_changed == 'true'
        run: mvn spotless:check -q

      # Step 2 — Lint check (Checkstyle / Google Checks).
      # Suppressions in checkstyle-suppressions.xml exempt existing source;
      # new files added after EPIC-0059 must pass Google-style checks clean.
      - name: Lint check (Checkstyle)
        if: steps.javadiff.outputs.java_changed == 'true'
        run: mvn checkstyle:check -q

      # Step 3 — Compile.
      # Ensures no compilation errors sneak in via --no-verify.
      - name: Compile
        if: steps.javadiff.outputs.java_changed == 'true'
        run: mvn compile -q

  dependency-review:
    name: Dependency review (PR only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Review new dependencies for CVEs / license issues
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  publish:
    name: Publish to GitHub Packages (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # server-id=github wires ~/.m2/settings.xml so `mvn deploy`
      # authenticates to GitHub Packages with the workflow token.
      - name: Setup JDK 21 + Maven settings (server-id=github)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: mvn -B -DskipTests deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -DskipTests deploy

      - name: Stash uber-jar + SBOM for downstream jobs
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: |
            target/ia-dev-kit-*.jar
            target/bom.json
          retention-days: 1
          if-no-files-found: error

  release-assets:
    name: Attach assets + provenance to GitHub Release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create / upload to GitHub Release
      id-token: write       # OIDC for SLSA + cosign keyless
      attestations: write   # SLSA build provenance attestation
    steps:
      - name: Checkout (for default release notes)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: artifacts/

      - name: Generate SLSA build-provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "artifacts/ia-dev-kit-*.jar"

      - name: Install cosign (Sigstore keyless)
        uses: sigstore/cosign-installer@v3

      - name: Sign uber-jar with cosign keyless (OIDC)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          JAR=$(ls artifacts/ia-dev-kit-*.jar | head -1)
          cosign sign-blob --yes \
            --output-signature "${JAR}.sig" \
            --output-certificate "${JAR}.crt" \
            "${JAR}"

      - name: Ensure GitHub Release exists for ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              --verify-tag
          fi

      - name: Upload uber-jar + SBOM + cosign artifacts to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" \
            artifacts/ia-dev-kit-*.jar \
            artifacts/ia-dev-kit-*.jar.sig \
            artifacts/ia-dev-kit-*.jar.crt \
            artifacts/bom.json \
            --clobber

